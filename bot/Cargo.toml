[package]
name = "rugbot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
bincode = "1.3"
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
yellowstone-grpc-client = "16.0.0"
yellowstone-grpc-proto = "14.0.1"
solana-pubkey = { version = "4", features = ["curve25519", "std"] }
solana-keypair = "4"
solana-signer = "4"
solana-hash = "4"
solana-signature = "3"
parking_lot = "0.12"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
